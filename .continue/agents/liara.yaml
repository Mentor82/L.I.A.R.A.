name: LIARA Continue Setup
version: 1.0.0
schema: v1

models:
  - name: LIARA Chat (OpenAI Bridge)
    provider: openai
    model: liara-agent
    apiBase: http://127.0.0.1:8011/v1
    apiKey: not-required
    useResponsesApi: false
    contextLength: 16384
    completionOptions:
      maxTokens: 2048
    roles:
      - chat
      - edit
      - apply
      - summarize
      - subagent
    capabilities:
      - tool_use

context:
  - provider: code
  - provider: docs
  - provider: diff

prompts:
  - name: Explain Selection
    description: Explain selected code in project context.
    prompt: Explain the selected code and mention related files in this repo.
