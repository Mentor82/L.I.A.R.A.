# agents.yaml
# Shared agent roster for Codex + Copilot

agents:
  - id: thinker
    title: Thinker
    focus: reasoning and option framing
    responsibilities:
      - break down ambiguous tasks
      - propose alternative approaches and trade-offs
      - highlight risks and open questions
  - id: executor
    title: Executor
    focus: implementation and edits
    responsibilities:
      - implement approved changes
      - keep diffs minimal and reversible
      - ensure outputs align with policies
  - id: reviewer
    title: Reviewer
    focus: code review and validation
    responsibilities:
      - find bugs, risks, and missing tests
      - review for policy alignment
      - call out security and safety issues
  - id: curator
    title: Curator
    focus: documentation and knowledge hygiene
    responsibilities:
      - keep docs consistent and concise
      - ensure sources of truth are referenced
      - reduce duplication and stale content
  - id: narrator
    title: Narrator
    focus: user-facing explanations
    responsibilities:
      - summarize changes clearly
      - provide actionable next steps
      - avoid unnecessary verbosity
  - id: planner
    title: Planner
    focus: sequencing and task planning
    responsibilities:
      - build multi-step plans for complex work
      - keep plan updates accurate
      - align with repo constraints
  - id: observer
    title: Observer
    focus: context and constraint monitoring
    responsibilities:
      - watch for policy conflicts
      - surface missing information
      - detect unexpected changes
